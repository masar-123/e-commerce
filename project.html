<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=support_agent" />
  <!-- Render All Elements Normally -->
  <link rel="stylesheet" href="./assets/css/normalize.css" />

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <link rel="stylesheet" href="./assets/css/all.min.css" />
  <!-- Main Template CSS File -->
  <link rel="stylesheet" href="./assets/css/project.css" />

<footer class="footer">
  <div class="footer-top">
    <div class="support-info" style="gap: 10px;">
       <span class="material-symbols-outlined" style="font-size: 50px;">support_agent</span>
       <div style="flex-direction: column;">
        <h4>Customer Support</h4>
        <p>Sat - Thurs, 11am - 7pm</p>
      </div>
    </div>
    <div class="returns-info" style="gap: 10px;">
      <i class="icon" style="font-size: 50px;">↩</i>
      <div style="flex-direction: column;">
        <h4>Easy Returns</h4>
        <p>Returns & Exchanges extended to 14 days</p>
      </div>
    </div>
  </div>

  <div class="footer-main">
    <div class="support">
      <h4>SUPPORT</h4>
      <ul>
        <li><a href="#">Search</a></li>
        <li><a href="#">Return & Exchange Policy</a></li>
        <li><a href="#">Delivery</a></li>
        <li><a href="#">Contact Info</a></li>
      </ul>
    </div>

    <div class="newsletter">
      <h4>NEWSLETTER</h4>
      <form>
        <input type="email" placeholder="Email" style="background-color: black; color: #000;" >
        <button type="submit">→</button>
      </form>
    </div>
  </div>

  <div class="footer-bottom">
    <div class="footer-left">
      <select>
        <option>English</option>
      </select>
     
    </div>

    <div class="footer-right">
      <p>© 2025 Decked Out, All rights reserved. <a href="#">Powered by Shopify</a></p>
      <div class="payment-icons">
        <img src="assets/images/images.png" alt="Amex">
        <img src="assets/images/Apple-Pay-Logo.png" alt="Apple Pay" style="background-color: #fff; border-radius: 2px;">
        <img src="assets/images/Mastercard_2019_logo.svg.png" alt="Mastercard">
        <img src="assets/images/images (1).png" alt="Visa">
      </div>
    </div>
  </div>
</footer>
